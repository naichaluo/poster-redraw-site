# nginx 反向代理配置 —— 部署到 /etc/nginx/sites-available/poster-redraw
# 新网站使用子域名 poster.taizhongtxl.cn，旧站(taizhongtxl.cn)保持不动，互不干扰。
#
# 使用前：
#   1) 把下面两处证书路径改成你实际 .pem/.key 的绝对路径
#   2) sudo ln -s /etc/nginx/sites-available/poster-redraw /etc/nginx/sites-enabled/
#   3) sudo nginx -t && sudo systemctl reload nginx

# HTTP -> 强制跳转 HTTPS
server {
    listen 80;
    server_name poster.taizhongtxl.cn;

    # 让 ACME/宝塔能验证证书（如用 certbot）
    location /.well-known/acme-challenge/ { root /var/www/html; }

    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl;
    server_name poster.taizhongtxl.cn;

    # ===== 替换成你重新签发的证书路径（bind 该子域名）=====
    ssl_certificate     /etc/nginx/ssl/taizhongtxl.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/taizhongtxl.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;

    # 图片上传/下载需要大请求体 + 长超时
    client_max_body_size 40m;

    # 转发到内网 node（server.js 只监听 127.0.0.1:3000）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 静态资源缓存（index.html / 前端资源）
    location ~* \.(js|css|html|json)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
